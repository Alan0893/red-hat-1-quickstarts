# Disposable cluster demo. Remove the broad-egress waiver before production use.
# Capture the replacement foundation before enabling enrollment.
saw:
  containerGovernance:
    enabled: true
    namespace: saw-container-governance
    revision: ac1faf21a65112e42622d708fe4a8a77791482c2
    imageBuildNamespace: saw-component-builds
    values:
      image: image-registry.openshift-image-registry.svc:5000/saw-component-builds/governance-interceptor@sha256:70e3d43c1ffee2cf56947da3bae26678077152894825aa402bbceb5490ab230a
      kubernetesGateways:
        - {namespace: saw-user-8shcw, gatewayId: user-8shcw}
  portal:
    enabled: true
    values:
      deploymentModes: [vm, container]
      pruneOnRemove: true
      containerSites:
        user-8shcw:
          subject: f4399144-cbe6-4b2a-ad75-de5aa8a7f1b5
          governanceNamespace: saw-container-governance
          network:
            externalCIDRs: [0.0.0.0/0, "::/0"]
          providerAllowHosts: [maas-rhdp.apps.maas.redhatworkshops.io]
          customInferenceURL: https://maas-rhdp.apps.maas.redhatworkshops.io/v1
          profileImageOverrides:
            custom-inference:
              notebook: quay.io/aipcc/base-images/agentic/openclaw@sha256:896d1526ee29b53167034ba65d1c758c8da777f441ed094e19f3bcf6d7445c61
          profileBoundaries:
            custom-inference:
              inferenceBaseURL: https://maas-rhdp.apps.maas.redhatworkshops.io/v1
              allowHosts: [maas-rhdp.apps.maas.redhatworkshops.io]
              reference: {} # populated after reviewing the new foundation
          stack:
            identity:
              revision: b979c53e632307548791b570f5b3ec727c4dca2d
              values:
                enabled: true
                ownerID: "@INSTALLATION@"
                targetNamespace: "@RUNTIME@"
                gateway: "@OWNER@"
                serverSans:
                  - "@OWNER@-gateway.@RUNTIME@.svc"
                  - "@OWNER@-gateway.@RUNTIME@.svc.cluster.local"
            policy:
              revision: b979c53e632307548791b570f5b3ec727c4dca2d
              values:
                enabled: true
                targetNamespace: "@RUNTIME@"
                gatewayId: "@OWNER@"
                gatewayServiceAccount: "@OWNER@-gateway"
                sandboxServiceAccount: "@OWNER@-sandbox"
                mode: container
                network:
                  allowDemoBroadEgress: true
                  priority: 51
                  egress:
                    - name: demo-egress
                      to:
                        - networks: [0.0.0.0/0, "::/0"]
                      ports:
                        - portNumber: {protocol: TCP, port: 443}
                        - portNumber: {protocol: TCP, port: 6443}
                        - portNumber: {protocol: TCP, port: 3128}
                        - portNumber: {protocol: TCP, port: 17670}
                        - portNumber: {protocol: TCP, port: 5500}
                        - portNumber: {protocol: TCP, port: 53}
                        - portNumber: {protocol: UDP, port: 53}
                        - portNumber: {protocol: TCP, port: 5353}
                        - portNumber: {protocol: UDP, port: 5353}
            proxy:
              revision: b979c53e632307548791b570f5b3ec727c4dca2d
              values:
                enabled: true
                ownerID: "@INSTALLATION@"
                gateway: "@OWNER@"
                targetNamespace: "@RUNTIME@"
                policyConfigMap: "@OWNER@-proxy-policy"
                network:
                  bootstrapEgress: &demoEgress
                    - to:
                        - ipBlock: {cidr: 0.0.0.0/0}
                        - ipBlock: {cidr: "::/0"}
                      ports:
                        - {protocol: TCP, port: 443}
                        - {protocol: TCP, port: 6443}
                        - {protocol: TCP, port: 53}
                        - {protocol: UDP, port: 53}
                        - {protocol: TCP, port: 5353}
                        - {protocol: UDP, port: 5353}
                    - to:
                        - namespaceSelector:
                            matchLabels: {kubernetes.io/metadata.name: openshift-dns}
                      ports:
                        - {protocol: TCP, port: 53}
                        - {protocol: UDP, port: 53}
                        - {protocol: TCP, port: 5353}
                        - {protocol: UDP, port: 5353}
                  proxyEgress: *demoEgress
            gateway:
              revision: b979c53e632307548791b570f5b3ec727c4dca2d
              values:
                deployment: {mode: container}
                kubernetes:
                  experimental: true
                  workload:
                    image: quay.io/aipcc/base-images/agentic/openclaw@sha256:896d1526ee29b53167034ba65d1c758c8da777f441ed094e19f3bcf6d7445c61
                    runtimeImage: quay.io/opendatahub/odh-openshell-sandbox@sha256:acc2e36f4b05d494714aaa0a10392d2148bda3c26bbf75078f6b3c3cdf7c67ea
                  identity:
                    serverTlsSecret: >-
                      @OWNER@-server
                    clientCaSecret: >-
                      @OWNER@-client-ca
                    jwtSecret: "@OWNER@-jwt"
                    credentialKeySecret: "@OWNER@-kek"
                  storage:
                    className: ocs-external-storagecluster-ceph-rbd
                  proxy:
                    url: http://@OWNER@-credential-proxy.@TRUSTED@.svc:3128
                    caConfigMap: "@OWNER@-proxy-ca"
                  governance:
                    endpoint: http://governance-interceptor.saw-container-governance.svc:18081
                  network:
                    allowDemoBroadEgress: true
                    reconcilerNamespace: "@TRUSTED@"
                    reconcilerLabels:
                      app.kubernetes.io/instance: "@OWNER@"
                      openshell.pattern/role: reconciler
                    gatewayEgress:
                      - to:
                          - ipBlock: {cidr: 0.0.0.0/0}
                          - ipBlock: {cidr: "::/0"}
                        ports:
                          - {protocol: TCP, port: 443}
                          - {protocol: TCP, port: 6443}
                          - {protocol: TCP, port: 53}
                          - {protocol: UDP, port: 53}
                          - {protocol: TCP, port: 5353}
                          - {protocol: UDP, port: 5353}
                      - to:
                          - namespaceSelector:
                              matchLabels: {kubernetes.io/metadata.name: "@TRUSTED@"}
                            podSelector:
                              matchLabels: {app.kubernetes.io/instance: "@OWNER@", openshell.pattern/role: credential-proxy}
                        ports: [{protocol: TCP, port: 3128}]
                      - to:
                          - namespaceSelector:
                              matchLabels: {kubernetes.io/metadata.name: saw-container-governance}
                            podSelector:
                              matchLabels: {app.kubernetes.io/name: governance-interceptor}
                        ports: [{protocol: TCP, port: 18081}]
                      - to:
                          - namespaceSelector:
                              matchLabels: {kubernetes.io/metadata.name: openshift-dns}
                        ports:
                          - {protocol: TCP, port: 53}
                          - {protocol: UDP, port: 53}
                          - {protocol: TCP, port: 5353}
                          - {protocol: UDP, port: 5353}
                oidc:
                  issuerUrl: https://openshell-keycloak-ingress-saw-keycloak.apps.@DOMAIN@/realms/openshell
                route: {enabled: false}
            audit:
              revision: b979c53e632307548791b570f5b3ec727c4dca2d
              values:
                enabled: true
                trustedNamespace: "@ARCHIVE@"
                runtimeNamespace: "@RUNTIME@"
                ownerID: "@INSTALLATION@"
                storageClass: ocs-external-storagecluster-ceph-rbd-immediate
                exchangeStorageClass: ocs-external-storagecluster-cephfs
                image: registry.access.redhat.com/ubi9/nodejs-24@sha256:d843698c5564f9a066a9f45bb1b0392b0b0926f3aa1b37a242b99ed19f16408a
                identity:
                  subject: "@SUBJECT@"
                  username: "@OWNER@"
                  workspace: default
                  sandbox: notebook
          automaticEnrollment:
            enabled: false # foundation review
            revision: b979c53e632307548791b570f5b3ec727c4dca2d
            image: quay.io/sauagarw/saw-kubernetes-runtime@sha256:89dc067ddae743ac0a94d957c102a4849f101dc5ba8582ccad6f758ad3ccf605
            buildNamespace: openshell-agents
            resources:
              requests: {cpu: 500m, memory: 1Gi}
              limits: {cpu: "2", memory: 4Gi}
            approvedProfiles:
              custom-inference: 827017962e9b95ed65e890205a5684d414ab0df2930f187b0ebec6e570632977
            relay:
              revision: b979c53e632307548791b570f5b3ec727c4dca2d
              keycloakNamespace: saw-keycloak
              keycloakProvisionerSecret: saw-relay-provisioner
              issuer: https://openshell-keycloak-ingress-saw-keycloak.apps.cluster-zzt2m.dyn.redhatworkshops.io/realms/openshell
              egress: *demoEgress
