# The bootstrap Application also owns the operational tuning for the OpenShift
# GitOps instance it relies on. The repo-server fetches this repository over the
# cluster egress path; keep its Git command timeout and the application
# controller RPC timeout aligned.
gitops:
  argocd:
    name: openshift-gitops
    repo:
      execTimeout: 300
    controller:
      repoServerTimeoutSeconds: 300
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2
          memory: 4Gi
      processors:
        operation: 3
        status: 5

# SAW is opt-in so existing clusters do not receive new operators implicitly.
saw:
  enabled: false
  git:
    url: https://github.com/rhpds/red-hat-1-quickstarts.git
    revision: main
  gitopsNamespace: openshift-gitops
  clusterDomain: ""
  # OpenShift Virtualization, for VM workspaces. Container-only sites turn it
  # off: no operator, no HyperConverged, and saw_prepare skips the VM golden
  # image and SSH key.
  virtualization:
    enabled: true
  # Shared synthetic demo services in openshell-agents. Enable all three
  # flags for authenticated, automatically populated tenant sources.
  demo:
    enabled: false
    calendarEnabled: false
    provisioningEnabled: false
    oidcIssuer: ""
  keycloak:
    postgresPassword: ""
    values: {}
  vault:
    values: {}
  externalSecrets:
    values: {}
  # Container workspaces (SAW deployment.mode: container). Off by default so
  # VM-only clusters are unchanged. Turns on Argo CD's ApplicationSet
  # controller, which generates each container workspace's applications.
  container:
    enabled: false
    # The cluster-wide Agent Sandbox controller and CRDs. Leave on unless the
    # platform already provides a compatible installation.
    agentSandbox: true
    # The vendored interceptor default predates mTLS operator access
    # (upstream 118b4cfa), which container workspaces need. This is the
    # upstream CI build of f582a118 (OpenShell v0.1.6, multi-arch index).
    # saw.governance.values.image still wins if set.
    governanceImage: ghcr.io/validatedpatterns-sandbox/governance-interceptor@sha256:8c8feeec3b25de48604a5bbc62bba45e6d10ac1d08a5efbd6b8ceee988ca4aa9
  inferenceSeed:
    enabled: false
    sourceSecret: saw-inference
    # Prefer a pre-created Kubernetes Secret. If set, these values are rendered
    # into a Secret and are also visible in the Argo CD Application spec.
    secretData: {}
    vaultTokenSecret: saw-vault-writer
    vaultTokenKey: token
    vaultPath: hub/inference
  governance:
    values: {}
    customInference:
      host: ""
      port: 443
  operators:
    source: redhat-operators
    sourceNamespace: openshift-marketplace
    externalSecretsChannel: stable-v1
    virtualizationChannel: stable
    keycloakChannel: stable-v26
