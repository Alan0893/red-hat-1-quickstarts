---
# 1. The OpenShell account. saw-users needs its Keycloak subject to render a
#    container workspace, so create it here rather than in an Argo CD hook.
- name: Read the OpenShell Keycloak admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ saw_tenant_prepare_keycloak_namespace }}"
    name: "{{ saw_tenant_prepare_keycloak_admin_secret }}"
  register: _saw_kc_admin
  retries: 30
  delay: 10
  until: _saw_kc_admin.resources | default([]) | length == 1
  no_log: true

- name: Log in to the Keycloak admin API
  ansible.builtin.uri:
    url: "{{ saw_tenant_prepare_keycloak_url }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ _saw_kc_admin.resources[0].data.username | b64decode }}"
      password: "{{ _saw_kc_admin.resources[0].data.password | b64decode }}"
    validate_certs: "{{ saw_tenant_prepare_validate_certs }}"
  register: _saw_kc_login
  retries: 30
  delay: 10
  until: _saw_kc_login.status == 200
  no_log: true

- name: Set the admin API location
  ansible.builtin.set_fact:
    _saw_kc_api: "{{ saw_tenant_prepare_keycloak_url }}/admin/realms/{{ saw_tenant_prepare_keycloak_realm }}"
    _saw_kc_headers:
      Authorization: "Bearer {{ _saw_kc_login.json.access_token }}"
  no_log: true

- name: Look up the tenant's OpenShell account
  ansible.builtin.uri:
    url: "{{ _saw_kc_api }}/users?username={{ saw_tenant_prepare_username | urlencode }}&exact=true"
    headers: "{{ _saw_kc_headers }}"
    validate_certs: "{{ saw_tenant_prepare_validate_certs }}"
  register: _saw_kc_users

- name: Create the tenant's OpenShell account
  when: _saw_kc_users.json | length == 0
  ansible.builtin.uri:
    url: "{{ _saw_kc_api }}/users"
    method: POST
    headers: "{{ _saw_kc_headers }}"
    body_format: json
    body:
      username: "{{ saw_tenant_prepare_username }}"
      firstName: "{{ saw_tenant_prepare_username }}"
      lastName: User
      email: "{{ saw_tenant_prepare_username }}@openshell.local"
      emailVerified: true
      enabled: true
      credentials:
        - type: password
          value: "{{ saw_tenant_prepare_password }}"
          temporary: false
    status_code: 201
    validate_certs: "{{ saw_tenant_prepare_validate_certs }}"
  no_log: true

# Same rule as the in-cluster account Job: never reset an existing password.
- name: Check that an existing account still has the workshop password
  when: _saw_kc_users.json | length == 1
  ansible.builtin.uri:
    url: "{{ saw_tenant_prepare_keycloak_url }}/realms/{{ saw_tenant_prepare_keycloak_realm }}/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: openshell-cli
      username: "{{ saw_tenant_prepare_username }}"
      password: "{{ saw_tenant_prepare_password }}"
    validate_certs: "{{ saw_tenant_prepare_validate_certs }}"
  no_log: true

- name: Read the account's subject
  ansible.builtin.uri:
    url: "{{ _saw_kc_api }}/users?username={{ saw_tenant_prepare_username | urlencode }}&exact=true"
    headers: "{{ _saw_kc_headers }}"
    validate_certs: "{{ saw_tenant_prepare_validate_certs }}"
  register: _saw_kc_user
  failed_when: _saw_kc_user.json | length != 1

- name: Read the OpenShell realm roles
  ansible.builtin.uri:
    url: "{{ _saw_kc_api }}/roles/{{ item }}"
    headers: "{{ _saw_kc_headers }}"
    validate_certs: "{{ saw_tenant_prepare_validate_certs }}"
  register: _saw_kc_roles
  loop: [openshell-user, openshell-admin]

- name: Grant the account the OpenShell roles
  ansible.builtin.uri:
    url: "{{ _saw_kc_api }}/users/{{ _saw_kc_user.json[0].id }}/role-mappings/realm"
    method: POST
    headers: "{{ _saw_kc_headers }}"
    body_format: json
    body: "{{ _saw_kc_roles.results | map(attribute='json') | list }}"
    status_code: 204
    validate_certs: "{{ saw_tenant_prepare_validate_certs }}"

- name: Remember the tenant's owner subject
  ansible.builtin.set_fact:
    saw_tenant_owner_subject: "{{ _saw_kc_user.json[0].id }}"

# 2. A unique AdminNetworkPolicy priority, reused on reruns.
- name: Look for this tenant's existing priority reservation
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: "{{ saw_tenant_prepare_lease_namespace }}"
    label_selector: "saw.redhat.com/tenant={{ guid }},app.kubernetes.io/part-of=saw-anp-priority"
  register: _saw_own_lease

- name: Reserve the lowest free priority
  when: _saw_own_lease.resources | length == 0
  vars:
    # Re-read on every retry, so a 409 from a racing tenant moves on to the next number.
    _saw_leases: >-
      {{ query('kubernetes.core.k8s', api_version='v1', kind='ConfigMap',
               namespace=saw_tenant_prepare_lease_namespace,
               label_selector='app.kubernetes.io/part-of=saw-anp-priority')
         | map(attribute='data.priority') | map('int') | list }}
    _saw_anps: >-
      {{ query('kubernetes.core.k8s', api_version='policy.networking.k8s.io/v1alpha1',
               kind='AdminNetworkPolicy') | map(attribute='spec.priority') | map('int') | list }}
    _saw_candidate: >-
      {{ range(saw_tenant_prepare_priority_first | int, saw_tenant_prepare_priority_last | int + 1)
         | reject('in', _saw_leases + _saw_anps) | first }}
  ansible.builtin.uri:
    url: "{{ saw_tenant_prepare_api_url }}/api/v1/namespaces/{{ saw_tenant_prepare_lease_namespace }}/configmaps"
    method: POST
    headers:
      Authorization: "Bearer {{ saw_tenant_prepare_api_token }}"
    body_format: json
    body:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ saw_tenant_prepare_lease_prefix }}{{ _saw_candidate }}"
        labels:
          app.kubernetes.io/part-of: saw-anp-priority
          saw.redhat.com/tenant: "{{ guid }}"
      data:
        priority: "{{ _saw_candidate | string }}"
        user: "{{ saw_tenant_prepare_username }}"
    status_code: [201, 409]
    validate_certs: "{{ saw_tenant_prepare_validate_certs }}"
  register: _saw_new_lease
  retries: 20
  delay: 2
  until: _saw_new_lease.status == 201

- name: Remember the tenant's AdminNetworkPolicy priority
  ansible.builtin.set_fact:
    saw_tenant_anp_priority: >-
      {{ (_saw_own_lease.resources[0].data.priority if _saw_own_lease.resources | length > 0
          else _saw_new_lease.json.data.priority) | int }}

- name: Report the container workspace inputs
  ansible.builtin.debug:
    msg: "{{ saw_tenant_prepare_username }}: subject {{ saw_tenant_owner_subject }}, AdminNetworkPolicy priority {{ saw_tenant_anp_priority }}"
