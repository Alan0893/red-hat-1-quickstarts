{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" .Values.image) }}
{{- fail "image must be pinned by digest" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicale
  labels:
    app.kubernetes.io/name: radicale
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radicale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radicale
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: radicale
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --config
            - /config/config
          ports:
            - name: cal
              containerPort: {{ .Values.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /.web/
              port: cal
            initialDelaySeconds: {{ .Values.livenessInitialDelaySeconds }}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /.web/
              port: cal
            initialDelaySeconds: {{ .Values.readinessInitialDelaySeconds }}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if .Values.storage.size }}
            - name: data
              mountPath: /var/lib/radicale
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: radicale-config
        {{- if .Values.storage.size }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.storage.size }}
        {{- end }}
